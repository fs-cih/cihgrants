name: Add prospect
run-name: "Publish prospect · ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        description: 'Operation mode: add, edit, or delete'
        options:
          - add
          - edit
          - delete
      payload:
        required: true
        description: 'Prospect data as JSON string'
      request_id:
        required: true
        description: 'Unique request identifier used to confirm this publication'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Publish with conflict retries
        env:
          MODE: ${{ github.event.inputs.mode }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -euo pipefail
          git config user.name "cih-grants-bot"
          git config user.email "cih-grants-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
          node <<'EOF'
          const fs = require('fs');
          const payload = JSON.parse(process.env.PAYLOAD);
          const mode = process.env.MODE;
          const path = 'data/prospects.json';
          const prospects = JSON.parse(fs.readFileSync(path, 'utf8'));
          
          const findIndexForPayload = () => {
            if (payload.id) {
              return prospects.findIndex(prospect => prospect.id === payload.id);
            }
            const editIndex = payload.editIndex;
            if (editIndex !== undefined && typeof editIndex === 'number' && editIndex >= 0 && editIndex < prospects.length) {
              return editIndex;
            }
            return -1;
          };

          if (mode === 'edit') {
            const targetIndex = findIndexForPayload();
            if (targetIndex !== -1) {
              // Remove editIndex from payload before saving (it's metadata, not prospect data)
              const { editIndex: _removed, ...prospect } = payload;
              prospects[targetIndex] = prospect;
            } else {
              console.error('Could not find prospect to edit using id/editIndex:', payload.id, payload.editIndex);
              process.exit(1);
            }
          } else if (mode === 'delete') {
            const targetIndex = findIndexForPayload();
            if (targetIndex !== -1) {
              prospects.splice(targetIndex, 1);
            } else {
              console.error('Could not find prospect to delete using id/editIndex:', payload.id, payload.editIndex);
              process.exit(1);
            }
          } else if (mode === 'add') {
            if (!payload.id || prospects.some(item => item.id === payload.id)) {
              throw new Error('A new entry must have a unique ID.');
            }
            // mode === 'add'
            // Defensively remove editIndex if present (shouldn't be, but ensures clean data)
            const { editIndex: _removed, ...prospect } = payload;
            prospects.unshift(prospect);
          } else {
            throw new Error('Unknown operation mode.');
          }
          
          fs.writeFileSync(path, JSON.stringify(prospects, null, 2));
          EOF
            git add data/prospects.json
            # Saving an unchanged entry is already successful.
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish prospect: $MODE"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "Branch advanced or push failed; retrying publication ($attempt/5)."
            sleep "$attempt"
          done
          echo "Publication could not be committed after five attempts." >&2
          exit 1
